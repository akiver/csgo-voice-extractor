name: Publish new release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Select the release type
        required: true
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write
  contents: write

jobs:
  ensure-changes:
    name: Ensure there are changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to get all existing tags
          fetch-tags: true

      - name: Stop if there are no new changes
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --always)
          LAST_COMMIT=$(git rev-parse HEAD)
          LASTEST_TAG_COMMIT=$(git rev-list -n 1 $LATEST_TAG)
          if [ "$LASTEST_TAG_COMMIT" == "$LAST_COMMIT" ]; then
            echo "No new changes since the last tag. Stopping the workflow."
            exit 1
          fi
          exit 0

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: ensure-changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install deps
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install pkgconf

      - name: Build Opus
        run: |
          curl -fsSL https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz | tar -xz
          cd opus-1.5.2
          ./configure --host=x86_64-apple-darwin --prefix="$RUNNER_TEMP/opus" CC="clang -arch x86_64" --disable-doc --disable-extra-programs
          make -j"$(sysctl -n hw.ncpu)"
          make install
          lipo "$RUNNER_TEMP/opus/lib/libopus.0.dylib" -verify_arch x86_64
          cp "$RUNNER_TEMP/opus/lib/libopus.0.dylib" "$GITHUB_WORKSPACE/dist/bin/darwin-x64"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/opus/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Build
        run: |
          make build-darwin
          cd dist/bin
          zip -r darwin-x64.zip darwin-x64

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: darwin-x64
          path: dist/bin/darwin-x64.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: ensure-changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install deps
        run: |
          sudo apt install pkg-config libopus-dev
          cp /usr/lib/x86_64-linux-gnu/libopus.so.0 dist/bin/linux-x64

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Build
        run: |
          make build-linux
          cd dist/bin
          zip -r linux-x64.zip linux-x64

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: dist/bin/linux-x64.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: ensure-changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-pkg-config
            make

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install deps
        run: |
          choco install zip

      - name: Build Opus
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git clone https://github.com/xiph/opus
          cd opus
          git fetch --tags
          git checkout tags/v1.5.2
          mkdir build
          cd build
          cmake -A Win32 -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_SHARED_LIBS=ON ..
          cmake --build . --config Release
          cd ${{ github.workspace }}
          cp opus.pc.example opus.pc
          sed -i 's|^prefix=.*|prefix=${{ github.workspace }}/opus|' opus.pc

      - name: Build
        run: |
          cp opus/build/Release/opus.dll dist/bin/win32-x64
          make build-windows
        env:
          PATH: ${{ steps.msys2.outputs.msys2-location }}/mingw32/bin;${{ steps.msys2.outputs.msys2-location }}/usr/bin;${{ env.PATH }}
          CPATH: ${{ github.workspace }}/opus/include
          LIBRARY_PATH: ${{ github.workspace }}/opus/build/Release

      - name: Create archive
        run: |
          cd dist/bin
          zip -r win32-x64.zip win32-x64

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: win32-x64
          path: dist/bin/win32-x64.zip

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to get all existing tags
          fetch-tags: true
          ssh-key: ${{ secrets.SSH_KEY }}

      - name: Setup node
        uses: actions/setup-node@v7

      # Use a recent npm version that supports trusted publishing
      - name: Install npm
        run: |
          sudo npm install -g npm@11.7.0

      - name: Bump version
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version ${{ github.event.inputs.release-type }} --no-git-tag-version --tag-version-prefix=""
          node -p "require('./package.json').version" > /tmp/NEW_VERSION
          git add package.json
          git commit -m "chore: version $(cat /tmp/NEW_VERSION)"
          git tag "v$(cat /tmp/NEW_VERSION)"

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Extract and copy artifacts for NPM
        run: |
          mkdir -p dist/bin
          unzip -o darwin-x64/darwin-x64.zip -d dist/bin
          unzip -o linux-x64/linux-x64.zip -d dist/bin
          unzip -o win32-x64/win32-x64.zip -d dist/bin

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            darwin-x64/darwin-x64.zip
            linux-x64/linux-x64.zip
            win32-x64/win32-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm publish
          git push origin main --tags
